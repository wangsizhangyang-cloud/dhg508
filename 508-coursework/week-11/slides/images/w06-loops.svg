<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 250" role="img"><title>One round runs three loops: primary, secondary, primary again</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker></defs><g font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif"><rect x="30" y="60" width="230" height="120" fill="white" stroke="#d4d4d8" stroke-width="2"/><text x="145.0" y="100" font-size="23" fill="#18181b" text-anchor="middle" font-weight="700">1  Primary</text><text x="145.0" y="136" font-size="18" fill="#18181b" text-anchor="middle" font-weight="400">read the memoir first;</text><text x="145.0" y="166" font-size="18" fill="#18181b" text-anchor="middle" font-weight="400">notes → points</text><path d="M264 120 L312 120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/><rect x="316" y="60" width="230" height="120" fill="white" stroke="#d4d4d8" stroke-width="2"/><text x="431.0" y="100" font-size="23" fill="#18181b" text-anchor="middle" font-weight="700">2  Secondary</text><text x="431.0" y="136" font-size="18" fill="#18181b" text-anchor="middle" font-weight="400">read the studies</text><text x="431.0" y="166" font-size="18" fill="#18181b" text-anchor="middle" font-weight="400">against my points</text><path d="M550 120 L598 120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/><rect x="602" y="60" width="230" height="120" fill="white" stroke="#d4d4d8" stroke-width="2"/><text x="717.0" y="100" font-size="23" fill="#18181b" text-anchor="middle" font-weight="700">3  Primary again</text><text x="717.0" y="136" font-size="18" fill="#18181b" text-anchor="middle" font-weight="400">what the studies</text><text x="717.0" y="166" font-size="18" fill="#18181b" text-anchor="middle" font-weight="400">showed I still owe</text><text x="432" y="232" font-size="18" fill="#52525b" text-anchor="middle" font-weight="400">Each loop: read → annotate → synthesize → points. A pool review closes each.</text></g></svg>