<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 310" role="img"><title>I highlight and comment on a working copy; the agent extracts every note with its file and page into one table</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker></defs><g font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif"><path d="M30 40 H164 L180 56 V230 H30 Z M164 40 V56 H180" fill="white" stroke="#18181b" stroke-width="2.5" stroke-linejoin="round"/><rect x="44" y="96" width="122" height="22" fill="#fef08a"/><rect x="44" y="150" width="96" height="22" fill="#fef08a"/><text x="105" y="268" font-size="21" fill="#18181b" text-anchor="middle" font-weight="650">My working copy</text><text x="105" y="294" font-size="18" fill="#52525b" text-anchor="middle" font-weight="400">highlight + my comment</text><path d="M195 135 L285 135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/><rect x="295" y="70" width="210" height="130" fill="white" stroke="#dc2626" stroke-width="2.5"/><text x="400.0" y="110" font-size="23" fill="#18181b" text-anchor="middle" font-weight="700">Agent</text><text x="400.0" y="146" font-size="19" fill="#18181b" text-anchor="middle" font-weight="400">extracts every note</text><text x="400.0" y="176" font-size="19" fill="#18181b" text-anchor="middle" font-weight="400">with file and page</text><path d="M510 135 L600 135" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/><rect x="615" y="70" width="230" height="130" fill="white" stroke="#18181b" stroke-width="2.5"/><path d="M615 90 H845" stroke="#d4d4d8" stroke-width="2"/><circle cx="627" cy="80" r="3" fill="#18181b"/><circle cx="638" cy="80" r="3" fill="#18181b"/><circle cx="649" cy="80" r="3" fill="#18181b"/><text x="627" y="114" font-size="15" fill="#18181b" text-anchor="start" font-weight="400">C1 p.15  “introductory courses…”</text><text x="627" y="136" font-size="15" fill="#18181b" text-anchor="start" font-weight="400">C6 p.34  “nothing but English…”</text><text x="627" y="158" font-size="15" fill="#18181b" text-anchor="start" font-weight="400">M2 p.2   “各課多以英文教授”</text><text x="730.0" y="230" font-size="21" fill="#18181b" text-anchor="middle" font-weight="650">One table of notes</text><text x="730.0" y="256" font-size="18" fill="#52525b" text-anchor="middle" font-weight="400">source text | my comment</text></g></svg>